<nav class="navbar" aria-label="Navegação principal">
  <a class="navbar-marca" href="{{ url_for('home.index') }}">
    <img
      src="{{ url_for('static', filename='img/logo-nav.png') }}"
      alt="Página inicial da GTVM Finanças"
      class="navbar-logo"
    >
  </a>

  <button class="navbar-toggle" type="button" aria-label="Abrir menu"
          aria-expanded="false" aria-controls="menu-principal">
    <span aria-hidden="true">☰</span>
  </button>

  <ul class="navbar-nav" id="menu-principal">
    {% for endpoint, secao, titulo in [
      ('home.index', 'home', 'Menu Principal'),
      ('lancamentos.listar', 'lancamentos', 'Lançamentos'),
      ('relatorios.exibir', 'relatorios', 'Relatórios'),
      ('investimentos.listar', 'investimentos', 'Investimentos')
    ] %}
      <li>
        <a href="{{ url_for(endpoint) }}"
           {% if request.blueprint == secao %}class="ativo"{% endif %}
           {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>
          {{ titulo }}
        </a>
      </li>
    {% endfor %}
  </ul>
</nav>

<script src="{{ url_for('static', filename='js/navbar.js') }}" defer></script>
